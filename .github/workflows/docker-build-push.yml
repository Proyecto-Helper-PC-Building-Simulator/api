name: Build and Push Docker Image

on:
  push:
    branches:
      - 'feature/add-github-actions'
      # - main       # Rama de producción
      # - develop    # Rama de desarrollo
      # - 'release/*' # Opcional: ramas de release según GitFlow
      # - 'feature/*' # Opcional: ramas de feature según GitFlow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Clone the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Configure Java and Maven
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package

      - name: Verify JAR exists
        run: ls -R target

      - name: Extract branch name
        id: vars
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

      # 3. Build and tag Docker image
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            bitraw/api-pc-building-sim:latest
            bitraw/api-pc-building-sim:${{ env.BRANCH_NAME }}